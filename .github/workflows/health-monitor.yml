name: Monitor de producao

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-producao
  cancel-in-progress: true

env:
  SITE_URL: https://jeova-nissi.vercel.app
  SUPABASE_PROJECT_REF: brlmggncnoyngukztxhi

jobs:
  verificar:
    name: Site e banco
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Verificar producao e recuperar Supabase inativo
        env:
          SUPABASE_MANAGEMENT_API_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_API_TOKEN }}
        run: node scripts/monitor-production.mjs
