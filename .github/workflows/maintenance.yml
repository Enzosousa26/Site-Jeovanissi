name: Manutencao do projeto

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manutencao-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Sintaxe e dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Validar sintaxe
        run: npm run check

      - name: Auditar vulnerabilidades importantes
        run: npm run audit
